services:
  db:
    image: postgres:16-alpine
    container_name: karen_dashboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: karen_dashboard
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d karen_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
